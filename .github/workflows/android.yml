name: Android CI
# Final APK build trigger for the validated 1.2.5 release.
# Keep shell line continuations in the Russian OCR model download intact.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload the final APK after all feature work is complete"
        required: true
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download bundled Russian OCR model
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata" \
            --output app/src/main/assets/tessdata/rus.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/rus.traineddata)" -gt 1000000
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build debug APK (explicit final build only)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK (explicit final build only)
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        uses: actions/upload-artifact@v4
        with:
          name: DigiDrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
