name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/offline-map-yandex-navigation ]
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload the final APK after all feature work is complete"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Download bundled Kaluga PMTiles
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build-kaluga-map.yml
          run_id: 42376599076
          name: DigiDrop-Kaluga-Offline-Map
          path: app/src/main/assets
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Build debug APK (explicit final build only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK (explicit final build only)
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk == true
        uses: actions/upload-artifact@v4
        with:
          name: DigiDrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
